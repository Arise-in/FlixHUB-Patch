name: Update README Release Info

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README with latest release & downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, os

          repo = os.environ["GITHUB_REPOSITORY"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"}
          )
          with urllib.request.urlopen(req) as resp:
              releases = json.loads(resp.read().decode())

          total_downloads = sum(
              asset.get("download_count", 0)
              for rel in releases
              for asset in rel.get("assets", [])
              if asset.get("name", "").endswith(".apk")
          )

          if releases:
              latest = releases[0]
              tag = latest.get("tag_name", "v1.0.0")
              url = latest.get("html_url", f"https://github.com/{repo}/releases/latest")
              apk_assets = [a for a in latest.get("assets", []) if a.get("name", "").endswith(".apk")]
              dl_url = apk_assets[0]["browser_download_url"] if apk_assets else url
              block = (
                  f"<!-- RELEASE_START -->\n"
                  f"- **Latest Release:** [`{tag}`]({url}) • [Download `app-release.apk`]({dl_url})\n"
                  f"- **Total Downloads:** **{total_downloads}**\n"
                  f"<!-- RELEASE_END -->"
              )
          else:
              block = (
                  "<!-- RELEASE_START -->\n"
                  "- **Latest Release:** Pending\n"
                  "- **Total Downloads:** **0**\n"
                  "<!-- RELEASE_END -->"
              )

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          new_readme = re.sub(
              r"<!-- RELEASE_START -->.*?<!-- RELEASE_END -->",
              block,
              readme,
              flags=re.DOTALL,
          )
          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_readme)
          PY

      - name: Commit & Push README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update latest release & download count"
            git push
          fi
