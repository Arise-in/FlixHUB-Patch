name: Update README & Changelogs

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README & CHANGELOG.md with all releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, os

          repo = os.environ["GITHUB_REPOSITORY"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"}
          )
          with urllib.request.urlopen(req) as resp:
              releases = json.loads(resp.read().decode())

          total_downloads = sum(
              asset.get("download_count", 0)
              for rel in releases
              for asset in rel.get("assets", [])
              if asset.get("name", "").endswith(".apk")
          )

          tv_releases = [r for r in releases if not r.get("tag_name", "").startswith("mobile-")]
          mobile_releases = [r for r in releases if r.get("tag_name", "").startswith("mobile-")]

          lines = ["<!-- RELEASE_START -->"]
          if tv_releases:
              tv = tv_releases[0]
              tv_tag = tv.get("tag_name", "v1.4.0")
              tv_url = tv.get("html_url", f"https://github.com/{repo}/releases/tag/{tv_tag}")
              tv_apks = [a for a in tv.get("assets", []) if a.get("name", "").endswith(".apk")]
              tv_apk_name = tv_apks[0]["name"] if tv_apks else "app-release.apk"
              tv_dl = tv_apks[0]["browser_download_url"] if tv_apks else tv_url
              lines.append(f"- **Latest TV Release:** [`{tv_tag}`]({tv_url}) • [Download `{tv_apk_name}`]({tv_dl})")
          if mobile_releases:
              mb = mobile_releases[0]
              mb_tag = mb.get("tag_name", "mobile-v1.0.0")
              mb_url = mb.get("html_url", f"https://github.com/{repo}/releases/tag/{mb_tag}")
              mb_apks = [a for a in mb.get("assets", []) if a.get("name", "").endswith(".apk")]
              mb_apk_name = mb_apks[0]["name"] if mb_apks else "flixhub-mobile-release.apk"
              mb_dl = mb_apks[0]["browser_download_url"] if mb_apks else mb_url
              lines.append(f"- **Latest Mobile Release:** [`{mb_tag}`]({mb_url}) • [Download `{mb_apk_name}`]({mb_dl})")
          lines.append(f"- **Total Downloads:** **{total_downloads}**")
          lines.append("<!-- RELEASE_END -->")
          release_block = "\n".join(lines)

          changelog_entries = []
          for rel in releases:
              r_tag = rel.get("tag_name", "")
              r_name = rel.get("name") or r_tag
              r_url = rel.get("html_url", "")
              r_date = (rel.get("published_at") or "")[:10]
              r_body = (rel.get("body") or "No release notes provided.").strip()
              r_apks = [a for a in rel.get("assets", []) if a.get("name", "").endswith(".apk")]
              r_dl = f" • [Download `{r_apks[0]['name']}`]({r_apks[0]['browser_download_url']})" if r_apks else ""
              changelog_entries.append(
                  f"### [`{r_tag}`]({r_url}) — {r_name} ({r_date}){r_dl}\n\n{r_body}"
              )

          changelog_md = "# Changelog\n\nAll releases for **FlixHUB TV** and **FlixHUB Mobile**.\n\n" + "\n\n---\n\n".join(changelog_entries) + "\n"
          with open("CHANGELOG.md", "w", encoding="utf-8") as f:
              f.write(changelog_md)

          readme_changelog_block = (
              "<!-- CHANGELOG_START -->\n"
              + "\n\n".join(changelog_entries)
              + "\n\n[Full Changelog](CHANGELOG.md)\n"
              + "<!-- CHANGELOG_END -->"
          )

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          readme = re.sub(
              r"<!-- RELEASE_START -->.*?<!-- RELEASE_END -->",
              release_block,
              readme,
              flags=re.DOTALL,
          )
          if "<!-- CHANGELOG_START -->" in readme:
              readme = re.sub(
                  r"<!-- CHANGELOG_START -->.*?<!-- CHANGELOG_END -->",
                  readme_changelog_block,
                  readme,
                  flags=re.DOTALL,
              )
          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme)
          PY

      - name: Commit & Push README and CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update releases, downloads & CHANGELOG.md"
            git push
          fi
